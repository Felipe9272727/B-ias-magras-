name: Shorts Director Cut (3× 1080×1920 · -14 LUFS)

on:
  workflow_dispatch:

jobs:
  render_short:
    name: Short ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ShortInt1DC
            music: investigations.mp3
            out: Short_Interrogatorio1_Peixe_Qwen.mp4
          - id: ShortInt2DC
            music: investigations.mp3
            out: Short_Interrogatorio2_Opera_GLM.mp4
          - id: ShortAU8DC
            music: night-of-chaos.mp3
            out: Short_Among_IA_8_Disfarce_Marrom.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /video/remotion/*
            !/video/remotion/public/*
            /video/remotion/public/short_int1_dc/
            /video/remotion/public/short_int2_dc/
            /video/remotion/public/short_au8_dc/
            /video/remotion/public/voice_int/c6*
            /video/remotion/public/voice_int2/c6*
            /video/remotion/public/au8/
            /video/remotion/public/fonts/
            /video/remotion/public/sfx/
            /video/remotion/public/sfx_au2/
            /video/remotion/public/gifs/
            /video/remotion/public/music/
            /video/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/remotion/package-lock.json
      - name: Dependências Remotion & FFmpeg
        working-directory: video/remotion
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libasound2t64 > /dev/null || true
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          python3 ../scripts/shorts_baixar_assets.py
      - name: Render 1080×1920 + Mix -14 LUFS
        working-directory: video/remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts ${{ matrix.id }} out/raw.mp4 --concurrency=4 --crf=18 --log=error
          bash ../scripts/mix_short.sh out/raw.mp4 "public/music/${{ matrix.music }}" 0.34 "out/${{ matrix.out }}"
          ls -lh "out/${{ matrix.out }}"
      - name: Upload Short ${{ matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: video/remotion/out/${{ matrix.out }}
          retention-days: 14

  pacote_final:
    name: Pacote único 3× Shorts 1080×1920
    needs: render_short
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Short_*
          merge-multiple: true
          path: shorts_pacote
      - run: ls -lh shorts_pacote
      - uses: actions/upload-artifact@v4
        with:
          name: Shorts_Director_Cut_3x_1080x1920
          path: shorts_pacote/*.mp4
          retention-days: 14
