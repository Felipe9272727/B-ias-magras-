name: Minecraft native portrait Short capture
on:
  push:
    branches: ['codex/mc-short-*']
    paths: ['minecraft/**', 'video/scripts/**', 'video/shorts/mimo_native/scenes.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minecraft-short-portrait-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cache_key: mc-runtime-v2-${{ runner.os }}-${{ steps.runtime-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /minecraft/
            /video/scripts/
            /video/shorts/mimo_native/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool ffmpeg libgl1-mesa-dri libgl1 libxrender1 libxtst6 libxi6 libxrandr2 libasound2t64
          python -m pip install portablemc
          npm ci --prefix minecraft --ignore-scripts --no-audit --no-fund
      - id: runtime-key
        name: Resolve the exact previously approved runtime cache
        run: |
          python - <<'PY'
          import json,hashlib,os
          p=json.load(open('video/scripts/distributed_capture_profile.json'))
          original={'sources':p['source_sha256'],'settings':p['approved_settings']}
          from pathlib import Path
          native=hashlib.sha256()
          for source in sorted(Path('minecraft/cliente-replay').rglob('*')):
              if source.is_file():native.update(str(source).encode()+source.read_bytes())
          key=hashlib.sha256(json.dumps(original,sort_keys=True,separators=(',',':')).encode()).hexdigest()+'-'+native.hexdigest()[:16]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('key='+key+'\n')
          PY
      - uses: actions/cache@v4
        id: runtime
        with:
          path: work/runtime/runtime.tar.gz
          key: mc-runtime-v2-${{ runner.os }}-${{ steps.runtime-key.outputs.key }}
      - if: steps.runtime.outputs.cache-hit != 'true'
        name: Build native runtime
        run: python video/scripts/distributed_worker.py build --work work/build --output work/runtime/runtime.tar.gz
  capture:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /minecraft/
            /video/scripts/
            /video/shorts/mimo_native/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool ffmpeg libgl1-mesa-dri libgl1 libxrender1 libxtst6 libxi6 libxrandr2 libasound2t64
          python -m pip install portablemc
          npm ci --prefix minecraft --ignore-scripts --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: work/runtime/runtime.tar.gz
          key: ${{ needs.runtime.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Split the approved Short timeline
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          worker=int(os.environ['WORKER'])
          lines=Path('video/shorts/mimo_native/scenes.txt').read_text().splitlines()
          selected=[line for i,line in enumerate(lines) if i%4==worker]
          Path('work').mkdir(exist_ok=True)
          Path('work/scenes.txt').write_text('\n'.join(selected)+'\n')
          print('Worker',worker,'scenes:',len(selected))
          PY
      - name: Capture native 9 by 16 scenes
        run: python video/scripts/distributed_worker.py capture --runtime work/runtime/runtime.tar.gz --work work/capture --scenes work/scenes.txt --output work/portrait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-short-native-${{ matrix.worker }}
          path: |
            work/portrait
            work/capture/logs
          retention-days: 14
