name: Wolvesville EP2 native recovery
on:
  push:
    branches: ["codex/wolvesville-ep2-16p-20261031"]
    paths:
      - ".github/workflows/wolvesville-ep2-readable-recovery.yml"
      - "video/ep2-readable-recovery-request.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wolvesville-ep2-readable-recovery-${{ github.sha }}
  cancel-in-progress: false
jobs:
  render:
    name: Render part ${{ matrix.part }} of 16
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        part: [0]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /video/remotion/src/
            /video/remotion/package.json
            /video/remotion/package-lock.json
            /video/remotion/tsconfig.json
            /video/remotion/remotion.config.ts
            /video/remotion/public/fonts/
            /video/remotion/public/gifs/
            /video/remotion/public/sfx*/
            /video/remotion/public/voice_lobo_ep2/*.json
            /video/remotion/public/voice_lobo_ep2/abertura.mp3
            /video/remotion/public/voice_lobo_ep2/scenes/
            /video/remotion/public/timeline_lobo_ep2.json
            /video/scripts/render_ep2_part.py
            /lobisomem/elenco_ep2.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video/remotion/package-lock.json
      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            curl --fail --location --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz --output /tmp/ep2-ffmpeg.tar.xz
            mkdir -p /tmp/ep2-ffmpeg
            tar -xJf /tmp/ep2-ffmpeg.tar.xz -C /tmp/ep2-ffmpeg --strip-components=1
            echo /tmp/ep2-ffmpeg >> "$GITHUB_PATH"
          fi
      - name: Install renderer
        working-directory: video/remotion
        run: npm ci --no-audit --no-fund
      - name: Render exact range with PCM audio
        run: python3 video/scripts/render_ep2_part.py --index ${{ matrix.part }} --count 16 --out cloud_parts --scale 1 --crf 16
      - uses: actions/upload-artifact@v4
        with:
          name: ep2-part-${{ matrix.part }}
          path: cloud_parts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
  assemble:
    name: Assemble native frames, preserve original mixed audio and verify
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /video/scripts/
            /video/roteiro/
            /video/remotion/public/timeline_lobo_ep2.json
            /video/remotion/public/music/
            /video/remotion/public/voice_lobo_ep2/abertura*
            /lobisomem/
      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            curl --fail --location --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz --output /tmp/ep2-ffmpeg.tar.xz
            mkdir -p /tmp/ep2-ffmpeg
            tar -xJf /tmp/ep2-ffmpeg.tar.xz -C /tmp/ep2-ffmpeg --strip-components=1
            echo /tmp/ep2-ffmpeg >> "$GITHUB_PATH"
          fi
      - name: Recover fifteen completed native parts
        uses: actions/download-artifact@v4
        with:
          pattern: ep2-part-*
          run-id: 41473061074
          github-token: ${{ github.token }}
          path: cloud_parts
          merge-multiple: true
      - name: Add the replacement first part
        uses: actions/download-artifact@v4
        with:
          name: ep2-part-0
          path: cloud_parts
      - uses: actions/download-artifact@v4
        with:
          name: wolvesville-ep2-final
          run-id: 41386046682
          github-token: ${{ github.token }}
          path: previous_export
      - name: Restore preserved actual gameplay journals
        run: python3 lobisomem/checkpoint_ep2.py --restore
      - name: Join native 1080p parts and preserve the exact original AAC stream
        run: python3 video/scripts/merge_ep2_parts.py --parts cloud_parts --out cloud_final --audio-from previous_export/cloud_final/wolvesville_ep2_1080p.mp4 --audio-sha256 792eea91a7f2e20d16d42352fe0bd202525257260948eaf3aff6f5e1e939362d
      - name: Extract actual encoded review frames
        run: python3 video/scripts/extract_ep2_review_frames.py cloud_final/wolvesville_ep2_1080p.mp4 --out native_review
      - uses: actions/upload-artifact@v4
        with:
          name: wolvesville-ep2-native-review
          path: native_review/*
          retention-days: 7
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: wolvesville-ep2-readable-final
          path: |
            cloud_final/wolvesville_ep2_1080p.mp4
            cloud_final/verified_export_ep2.json
            cloud_final/cloud_assembly.json
            video/roteiro/creditos_lobo_ep2.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload verified readable video to GoFile
        run: python3 video/scripts/upload_gofile.py cloud_final/wolvesville_ep2_1080p.mp4 --verification cloud_final/verified_export_ep2.json --receipt cloud_final/gofile_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: wolvesville-ep2-readable-gofile
          path: cloud_final/gofile_receipt.json
          retention-days: 7
          compression-level: 0
